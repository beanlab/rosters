[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yp-body-first"
version = "0.1.0"
description = "A body-first Python function preprocessor"
requires-python = ">=3.10"

[project.scripts]
yp = "yp.cli:main"

[tool.setuptools]
packages = ["yp"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
