[project]
name = "jev-function-review"
version = "0.1.0"
description = "Review parsed functions with editable Jev code-quality checks"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6,<7",
  "typesafe-sdk>=0.7,<1",
]

[project.scripts]
jev-function-review = "review_functions:main"

[tool.pytest.ini_options]
python_files = ["test_*.py"]
