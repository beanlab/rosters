schema_version: "1.0"

# Polarity describes what a "yes" answer means:
#   positive: yes is a favorable quality signal
#   negative: yes is an unfavorable quality signal
groups:
  - id: readability_and_naming
    name: Readability and naming
    questions:
      - id: easy_to_follow
        polarity: positive
        instructions: Can the target function's behavior be followed on a first read?
        criteria:
          "true": The control flow and operations are straightforward to follow from the supplied code.
          "false": The code is difficult to follow without substantial rereading or reconstruction.

      - id: purpose_is_apparent
        polarity: positive
        instructions: Is the target function's purpose apparent from its name, signature, and implementation?
        criteria:
          "true": The name, signature, and implementation communicate a coherent purpose.
          "false": The function's purpose is unclear or conflicts with its name or signature.

      - id: names_are_descriptive
        polarity: positive
        instructions: Do names in the target function clearly communicate what their values or operations represent?
        criteria:
          "true": Names are descriptive enough to understand their roles from the supplied code.
          "false": Important names are vague, misleading, or require guesswork.

      - id: inconsistent_naming
        polarity: negative
        instructions: Does the target function use naming or code conventions that are noticeably inconsistent with the supplied file context?
        criteria:
          "true": The target visibly departs from conventions used by related functions without an apparent reason.
          "false": The target is consistent with the visible conventions, or the supplied context shows no inconsistency.

  - id: function_and_class_size
    name: Function and class size
    questions:
      - id: unusually_long_or_many_steps
        polarity: negative
        instructions: Is the target function unusually long or visibly responsible for many distinct steps?
        criteria:
          "true": The function is long or combines several distinct responsibilities that could be separated.
          "false": The function is focused and its length is proportionate to one coherent responsibility.

      - id: owning_class_is_large
        polarity: negative
        instructions: Does the target function belong to a class that visibly has many methods, fields, or responsibilities in the supplied class context?
        criteria:
          "true": The owning class appears large or overloaded with responsibilities.
          "false": The owning class appears reasonably focused, or the target is not a class method.

      - id: long_parameter_list
        polarity: negative
        instructions: Does the target function take too many separate arguments for its apparent responsibility?
        criteria:
          "true": The parameter list is visibly burdensome or suggests missing grouping or abstraction.
          "false": The number of parameters is modest and appropriate for the function's purpose.

  - id: control_flow_and_complexity
    name: Control flow and complexity
    questions:
      - id: excessive_nesting
        polarity: negative
        instructions: Does the target function contain conditionals or loops nested several levels deep?
        criteria:
          "true": Nested control flow makes the function visibly difficult to follow.
          "false": Control flow is flat or shallow enough to follow readily.

      - id: complex_conditionals
        polarity: negative
        instructions: Does the target function contain a condition combining many clauses or multiple levels of and/or logic?
        criteria:
          "true": At least one condition is visibly complex and hard to understand as a single expression.
          "false": Conditions are simple, named, or decomposed clearly.

      - id: flag_argument
        polarity: negative
        instructions: Does a boolean-like argument make the target function take substantially different behavioral paths?
        criteria:
          "true": A flag parameter selects meaningfully different behaviors within the function.
          "false": No flag argument controls substantially different behavior.

      - id: message_chain
        polarity: negative
        instructions: Does the target function navigate through a noticeably long chain of attributes or method results?
        criteria:
          "true": The code contains a long chain such as a.b.c.d that increases coupling or obscures intent.
          "false": Attribute and method access chains are short and direct.

  - id: duplication_and_unexplained_values
    name: Duplication and unexplained values
    questions:
      - id: duplicated_code
        polarity: negative
        instructions: Is code in the target function repeated or very similar to code in the supplied file context?
        criteria:
          "true": A meaningful block or sequence is visibly duplicated in the target or related functions.
          "false": No meaningful duplication is visible in the supplied context.

      - id: magic_values
        polarity: negative
        instructions: Does the target function use unexplained literal numbers or strings in its logic?
        criteria:
          "true": A literal carries non-obvious domain meaning and is not named or explained by its immediate use.
          "false": Literals are self-explanatory, structural, or represented by named values.

      - id: repeated_conditionals
        polarity: negative
        instructions: Does the target function repeat a conditional pattern or switch-like branch that also appears in the supplied file context?
        criteria:
          "true": Similar conditional branching is visibly repeated and may benefit from consolidation.
          "false": No repeated conditional pattern is visible in the supplied context.

  - id: inputs_errors_and_reporting
    name: Inputs, errors, and reporting
    questions:
      - id: appropriate_error_handling
        polarity: positive
        instructions: Does the target function handle and report reasonably foreseeable failures appropriately for its apparent role?
        criteria:
          "true": Recoverable failures are handled or propagated clearly, or the function has no visible need for local error handling.
          "false": A foreseeable failure is visibly swallowed, obscured, or left without appropriate handling or propagation.

      - id: broad_or_silent_exception_handling
        polarity: negative
        instructions: Does the target function catch overly broad exceptions or silently ignore errors?
        criteria:
          "true": The function catches errors too broadly, discards them, or suppresses useful failure information.
          "false": Exception handling is specific and informative, or the function does not catch exceptions.
